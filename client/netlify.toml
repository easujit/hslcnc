[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Tenant, X-Roles, X-Departments, Idempotency-Key"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"

# API redirects - must come before catch-all
[[redirects]]
  from = "/api/*"
  to = "https://hslcnc.onrender.com/api/:splat"
  status = 200
  force = true

# Catch-all for React Router - must come last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
