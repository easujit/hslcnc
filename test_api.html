<!DOCTYPE html>
<html>
<head>
    <title>API Test - Direct Backend</title>
</head>
<body>
    <h1>API Test - Direct Backend Connection</h1>
    <button onclick="testAPI()">Test API Connection</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing direct backend connection...';
            
            try {
                const response = await fetch('https://hslcnc.onrender.com/api/clinical/visits/', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Tenant': 'test-tenant',
                        'X-Roles': 'Doctor',
                        'X-Departments': 'Endocrinology'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <p style="color: green;">✅ Direct Backend Connection Successful!</p>
                        <p><strong>Response:</strong> ${JSON.stringify(data)}</p>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Headers:</strong> ${JSON.stringify([...response.headers.entries()])}</p>
                    `;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">❌ API Error: ${response.status} ${response.statusText}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">❌ Connection Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
